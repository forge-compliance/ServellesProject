<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password · Servelle's</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=077"><link rel="stylesheet" href="auth.css?v=077"><link rel="stylesheet" href="logo.css?v=077"><style>.reset-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:#071018}.reset-card{width:min(440px,100%);background:#09131c;border:1px solid rgba(210,157,62,.38);border-radius:24px;padding:38px;box-shadow:0 30px 80px #0009}.reset-logo{width:230px;height:150px;margin:0 auto 8px;background:url('servelles-logo.png') center/contain no-repeat}.reset-card h1{font-family:'Cormorant Garamond',serif;font-size:42px;text-align:center;margin:4px 0 8px}.reset-card>p{text-align:center;color:#9fb0bf;margin:0 0 26px}.reset-card label{display:grid;gap:7px;font-size:12px;margin:14px 0}.reset-card input{width:100%;box-sizing:border-box;padding:14px;background:#111e28;color:#fff;border:1px solid #30404c;border-radius:10px}.reset-card button{width:100%;padding:14px;border:0;border-radius:10px;background:#c58b2d;color:#fff;font-weight:700;margin-top:8px;cursor:pointer}.reset-card a{display:block;text-align:center;color:#d8a23e;text-decoration:none;margin-top:18px;font-size:13px}.reset-msg{min-height:22px;text-align:center;margin-top:14px;font-size:13px;color:#a9bbc9}.reset-msg.error{color:#ff737d}.hidden{display:none!important}</style></head><body><main class="reset-wrap"><section class="reset-card"><div class="reset-logo" aria-label="Servelle's"></div><div id="requestPanel"><h1>Reset password</h1><p>Enter your account email and we’ll send you a secure reset link.</p><form id="requestForm"><label>Email address<input id="resetEmail" type="email" autocomplete="email" required></label><button type="submit">SEND RESET LINK</button></form><div id="requestMsg" class="reset-msg"></div><a href="index.html">← Back to sign in</a></div><div id="updatePanel" class="hidden"><h1>Choose a new password</h1><p>Enter your new password below.</p><form id="updateForm"><label>New password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">UPDATE PASSWORD</button></form><div id="updateMsg" class="reset-msg"></div><a href="index.html">← Back to sign in</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=077"></script><script>const db=window.supabase.createClient(window.SERVELLES_SUPABASE_URL,window.SERVELLES_SUPABASE_PUBLISHABLE_KEY);const requestPanel=document.getElementById('requestPanel'),updatePanel=document.getElementById('updatePanel');const setMsg=(id,text,error=false)=>{const el=document.getElementById(id);el.textContent=text;el.classList.toggle('error',error)};document.getElementById('requestForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('resetEmail').value.trim();setMsg('requestMsg','Sending…');const redirectTo=new URL('reset-password.html',window.location.href).href;const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});if(error)return setMsg('requestMsg',error.message,true);setMsg('requestMsg','Reset link sent. Check your email.')});db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){requestPanel.classList.add('hidden');updatePanel.classList.remove('hidden')}});document.getElementById('updateForm').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b)return setMsg('updateMsg','Passwords do not match.',true);setMsg('updateMsg','Updating…');const {error}=await db.auth.updateUser({password:a});if(error)return setMsg('updateMsg',error.message,true);setMsg('updateMsg','Password updated. You can now sign in.');setTimeout(()=>location.href='index.html',1500)});</script></body></html>
