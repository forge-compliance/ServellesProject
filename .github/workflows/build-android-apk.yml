name: Build Servelles Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Servelles.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Servelles-Android-APK
          path: Servelles.apk
          if-no-files-found: error

      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest Servelles.apk \
            --title "Servelle's Android APK" \
            --notes "Latest installable Android build of Servelle's Guest Services."
